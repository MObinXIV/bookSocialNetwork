<form class="container-fluid card login-container" (ngSubmit)="login()">
  <h3 class="text-center">Login</h3>
  <hr>
  @if (errorMsg.length) {
    <div class="alert alert-danger" role="alert">
      @for (msg of errorMsg; track msg) {
        <p>{{msg}}</p>
      }
    </div>
  }
  <div class="mb-3">
    <label for="login" class="form-label">Email address</label>
    <input [(ngModel)]="authRequest.email" name="email" type="email" class="form-control" id="login" placeholder="name@example.com" required>
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input [(ngModel)]="authRequest.password" name="password" type="password" class="form-control" id="password" placeholder="Password" required>
  </div>
  <div class="d-flex justify-content-between mb-3">
    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
      @if (isSubmitting) {
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>&nbsp;Signing in…
      } @else {
        <em class="fas fa-sign-in-alt"></em>&nbsp;Sign in
      }
    </button>
    <div>
      Don't have an account?&nbsp;
      <button (click)="register()" type="button" class="btn btn-link">
        <em class="fas fa-sign-in-alt"></em>&nbsp;Register
      </button>
    </div>
  </div>
</form>
